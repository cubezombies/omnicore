appId: com.cubezombies.omnicore
productName: Omnicore
copyright: Copyright © 2026 cubezombies
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asar: true
# FFmpeg must be a real file on disk to be spawned.
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # User data lives outside the install dir; never wipe it on uninstall.
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: Omnicore
  createStartMenuShortcut: true
  artifactName: Omnicore-Setup-${version}.exe
publish: null
